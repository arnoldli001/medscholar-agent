[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medscholar-agent"
version = "1.0.0"
description = "MedScholar Agent — 面向医学研究者的本地化学术智能体"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MedScholar" }]
keywords = ["academic", "agent", "pubmed", "literature-review", "medical-research"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 本地 PDF 全文解析（Reader Agent）
pdf = ["pymupdf>=1.24"]
# 离线 PubMedBERT 嵌入（替代 Ollama 嵌入，需下载 ~400MB 模型）
local-embed = ["sentence-transformers>=2.7"]
# 以 MCP Server 形式对外暴露检索/格式化工具
mcp = ["mcp>=1.2"]
# 开发 / 测试 / CI：pytest 跑测试，ruff 做静态检查，pre-commit 做提交前门禁
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
all = [
    "pymupdf>=1.24",
    "sentence-transformers>=2.7",
    "mcp>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
medscholar = "medscholar.cli:main"

[tool.setuptools.packages.find]
include = ["medscholar*"]

[tool.setuptools.package-data]
medscholar = [
    "db/*.sql",
    "web/*.html",
    "web/*.js",
    "web/*.css",
    "web/*.svg",
    "web/*.ico",
    "eval/datasets/*.json",
    "eval/datasets/*.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
