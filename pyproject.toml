[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medscholar-agent"
version = "1.0.0"
description = "MedScholar Agent — 面向医学研究者的本地化学术智能体"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MedScholar" }]
keywords = ["academic", "agent", "pubmed", "literature-review", "medical-research"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 本地 PDF 全文解析（Reader Agent）
pdf = ["pymupdf>=1.24"]
# 离线 PubMedBERT 嵌入（替代 Ollama 嵌入，需下载 ~400MB 模型）
local-embed = ["sentence-transformers>=2.7"]
# 以 MCP Server 形式对外暴露检索/格式化工具
mcp = ["mcp>=1.2"]
# 开发 / 测试 / CI：pytest 跑测试，ruff 做静态检查，pre-commit 做提交前门禁
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
all = [
    "pymupdf>=1.24",
    "sentence-transformers>=2.7",
    "mcp>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
medscholar = "medscholar.cli:main"

[tool.setuptools.packages.find]
include = ["medscholar*"]

[tool.setuptools.package-data]
medscholar = [
    "db/*.sql",
    "web/*.html",
    "web/*.js",
    "web/*.css",
    "web/*.svg",
    "web/*.ico",
    "eval/datasets/*.json",
    "eval/datasets/*.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# 与 CI（`ruff check … --select F,E9`）和 pre-commit 保持同一套规则。
#
# 为什么只查 F + E9：这是**已跑通**的项目，把 4 万行代码一次性交给全部规则会产生
# 几百条风格诊断（BLE001 / RUF022 / UP035 …），真正有信息量的"未定义名"会被淹没。
# 风格问题在有测试覆盖的前提下优先级低于正确性，宁可不查也不制造噪音。
#
# 为什么还要显式写进配置（而不是只在命令行传 --select）：
# ruff 的**默认规则集会随版本变化** —— 实测 0.16 的默认集已包含扩展规则，
# 于是本机 `ruff check .` 报 264 条、CI 报 0 条，这种差异无法复现也无法 review。
# 把规则、排除目录和 Python 版本都 pin 在仓库里，"本地绿 = CI 绿"才成立。
target-version = "py310"
line-length = 100
exclude = [".python", ".venv", "venv", "build", "dist", "data", ".ruff_cache"]

[tool.ruff.lint]
select = ["F", "E9"]
