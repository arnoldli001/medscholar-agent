name: CI

# 触发策略：
#  * push / PR 到主分支都跑
#  * 支持手动触发（workflow_dispatch），便于排查
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的旧跑批自动取消，避免排队浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本流程只读仓库
permissions:
  contents: read

env:
  # 让 Python 输出不被缓冲，CI 日志能实时看到进度
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  # 关掉 pip 的版本检查提示，日志更干净
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1) 静态检查：快（秒级），放最前面，挂了就没必要跑测试
  # ---------------------------------------------------------------------------
  lint:
    name: 静态检查（ruff + 语法 + 纯函数断言 + .bat 约定）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff（未定义名 / 语法类错误）
        run: python -m ruff check medscholar tests scripts --select F,E9 --output-format=github

      - name: 全量语法编译
        run: python -m compileall -q medscholar scripts tests

      - name: 纯函数断言（tests/check.py 三件套）
        run: python scripts/check.py

      - name: .bat 必须纯 ASCII + CRLF
        # 这两条是踩过真实故障定的：UTF-8 中文在 936 代码页下乱码；
        # LF 换行会让 goto/标签失效并报出误导性错误。
        run: python scripts/check_bat.py

  # ---------------------------------------------------------------------------
  # 2) 单元与集成测试（主平台：Windows，与交付目标一致）
  # ---------------------------------------------------------------------------
  test:
    name: 测试（Windows / Python 3.13）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与随包分发的便携运行时同版本，保证"CI 绿 = 用户能用"
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 单元与集成测试
        # 608 个测试；全部离线运行，不需要 Ollama 与网络
        run: python -m pytest tests -q

  # ---------------------------------------------------------------------------
  # 3) HTTP 契约冒烟：打真实 uvicorn，逐条核对 docs/API.md
  #    （不用 ASGITransport，因为它会缓冲整个响应体，SSE 必然死锁）
  # ---------------------------------------------------------------------------
  smoke:
    name: HTTP 契约冒烟（真实 uvicorn）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 端到端冒烟（离线模式，不联网、不依赖 LLM）
        run: python -X utf8 scripts/smoke_http.py

  # ---------------------------------------------------------------------------
  # 4) 打包回归：确保"发给朋友的 zip"这条链路没被改坏
  #    注意：CI 里没有 .python 便携运行时（已被 .gitignore 排除），
  #    所以用 --no-runtime 只验证打包逻辑本身。
  # ---------------------------------------------------------------------------
  package:
    name: 打包回归（--no-runtime）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 构建分享包
        run: python -X utf8 scripts/pack_share.py --no-runtime

      - name: 校验包内容（必须有文档/启动器，且绝不能带 data/）
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          if (-not $zip) { throw "没有生成 zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $z.Entries | ForEach-Object { $_.FullName }
          $z.Dispose()

          $required = @('README.md', 'run.bat', 'run-doctor.bat', 'config.example.yaml')
          foreach ($want in $required) {
            if (-not ($names | Where-Object { $_ -like "*/$want" })) {
              throw "分享包缺少必要文件：$want"
            }
          }
          # 用户数据绝不进包：这是合规要求（授权内容不能随包分发）
          $leaked = $names | Where-Object { $_ -match '/data/' -and $_ -notmatch '说明' }
          if ($leaked) {
            throw "分享包泄漏了 data/ 内容：$($leaked -join ', ')"
          }
          Write-Host "分享包校验通过：$($names.Count) 个文件，未包含 data/"

  # ---------------------------------------------------------------------------
  # 5) Linux 测试（实验性）
  #    README 明确写了"Windows 为交付目标，Linux 理论可用、未验证"。
  #    这里如实标注为实验性：失败不会让整条流水线变红，但能看到进展。
  #    等它稳定后把 continue-on-error 去掉即可。
  # ---------------------------------------------------------------------------
  test-linux:
    name: 测试（Linux，实验性）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 单元与集成测试
        run: python -m pytest tests -q
